name: Build CrowGram Multiplatform Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CrowGram-Windows-x64.zip
            asset_path: dist/CrowGram-Windows-x64.zip
          - os: ubuntu-latest
            artifact_name: CrowGram-Linux-x64.tar.gz
            asset_path: dist/CrowGram-Linux-x64.tar.gz
          - os: macos-latest
            artifact_name: CrowGram-macOS-x64.tar.gz
            asset_path: dist/CrowGram-macOS-x64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview uvicorn fastapi pyrogram tgcrypto python-multipart
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libwebkit2gtk-4.1-dev
          pip install pyinstaller pywebview uvicorn fastapi pyrogram tgcrypto python-multipart
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview uvicorn fastapi pyrogram tgcrypto python-multipart
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean --onedir --console --name "CrowGram" --add-data "src;src" --add-data "src/web;src/web" --add-data "plugins;plugins" --add-data "themes;themes" desktop_app.py
          Compress-Archive -Path dist/CrowGram/* -DestinationPath dist/CrowGram-Windows-x64.zip

      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf build dist
          pyinstaller --noconfirm --clean --onedir --console --name "CrowGram" --add-data "src:src" --add-data "src/web:src/web" --add-data "plugins:plugins" --add-data "themes:themes" desktop_app.py
          cd dist && tar -czvf CrowGram-Linux-x64.tar.gz CrowGram/

      - name: Build Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf build dist
          pyinstaller --noconfirm --clean --onedir --windowed --name "CrowGram" --add-data "src:src" --add-data "src/web:src/web" --add-data "plugins:plugins" --add-data "themes:themes" desktop_app.py
          cd dist && tar -czvf CrowGram-macOS-x64.tar.gz CrowGram/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}